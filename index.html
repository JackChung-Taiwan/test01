<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翊華程式設計Github觀念小複習</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(255, 210, 235, .95), transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(180, 230, 255, .9), transparent 28%),
        linear-gradient(135deg, #fff0f7, #e6f7ff 52%, #fff7d6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #333;
    }
    .wrap {
      width: min(960px, 100%);
      background: rgba(255,255,255,.94);
      border: 4px solid #ff9acc;
      border-radius: 30px;
      padding: 28px;
      box-shadow: 0 18px 42px rgba(255, 92, 168, .28);
      position: relative;
      overflow: hidden;
    }
    .wrap::before {
      content: "✦";
      position: absolute;
      right: 24px;
      top: 14px;
      font-size: 110px;
      color: rgba(255, 92, 168, .12);
    }
    .hero {
      text-align: center;
      position: relative;
      z-index: 1;
    }
    .mascot {
      font-size: 70px;
      animation: floaty 2.2s ease-in-out infinite;
    }
    @keyframes floaty {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      margin: 8px 0 8px;
      color: #ff4fa3;
      font-size: clamp(28px, 5vw, 46px);
      text-shadow: 3px 3px 0 #ffe3f1;
      letter-spacing: 1px;
    }
    .subtitle {
      color: #6a6a6a;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin: 18px 0;
    }
    .badge {
      background: #fff3fb;
      border: 2px solid #ffacd4;
      border-radius: 999px;
      padding: 10px 18px;
      color: #d9368c;
      font-weight: 800;
      box-shadow: 0 5px 0 #ffd1e6;
    }
    .question-card {
      background: linear-gradient(180deg, #fff, #fff8fc);
      border: 3px dashed #ffb4d8;
      border-radius: 24px;
      padding: 24px;
    }
    .question {
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 900;
      line-height: 1.45;
      margin-bottom: 18px;
    }
    .options {
      display: grid;
      gap: 14px;
    }
    .option {
      border: 3px solid #9edcff;
      background: #f3fbff;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 6px 0 #b7e8ff;
      transition: .15s;
    }
    .option:hover:not(:disabled) {
      transform: translateY(-3px);
      background: #e7f7ff;
    }
    .option.correct {
      background: #dcffd9;
      border-color: #69d46b;
      box-shadow: 0 6px 0 #9be895;
    }
    .option.wrong {
      background: #ffe0e0;
      border-color: #ff7777;
      box-shadow: 0 6px 0 #ffadad;
    }
    .feedback {
      display: none;
      margin-top: 18px;
      background: #fff9df;
      border: 3px solid #ffd86b;
      border-radius: 20px;
      padding: 16px 18px;
      font-size: 19px;
      line-height: 1.6;
    }
    .feedback.show { display: block; }
    .next, .restart {
      display: block;
      margin: 22px auto 0;
      border: 0;
      border-radius: 999px;
      padding: 14px 38px;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, #ff6fb7, #73c8ff);
      cursor: pointer;
      box-shadow: 0 8px 0 #c8669d;
    }
    .next:disabled { opacity: .45; cursor: not-allowed; }
    .result { display: none; text-align: center; padding: 26px; }
    .result h2 { color: #ff4fa3; font-size: 42px; }
    .result p { font-size: 23px; line-height: 1.7; }
    .footer { text-align: center; margin-top: 18px; color: #888; font-size: 14px; }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="quiz">
      <div class="hero">
        <div class="mascot">🧑‍💻🌸🐱</div>
        <h1>翊華程式設計Github觀念小複習</h1>
        <div class="subtitle">完成 15 題小挑戰，答錯會看到解答喔！</div>
      </div>
      <div class="status">
        <div class="badge" id="count">第 1 / 15 題</div>
        <div class="badge" id="score">分數：0</div>
      </div>
      <div class="question-card">
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
      </div>
      <button class="next" id="next" disabled>下一題 ✨</button>
    </section>
    <section class="result" id="result">
      <div class="mascot">🎉🌈💻</div>
      <h2>測驗完成！</h2>
      <p id="finalScore"></p>
      <p id="comment"></p>
      <button class="restart" onclick="restartQuiz()">重新挑戰</button>
    </section>
    <div class="footer">翊華程式設計課程｜GitHub × HTML × JavaScript × CSS × PWA</div>
  </main>

  <script>
    const questions = [
      { q: "GitHub 主要可以用來做什麼？", o: ["玩線上遊戲", "儲存與管理程式碼", "製作圖片濾鏡"], a: 1, e: "GitHub 可以用來儲存、管理與分享程式碼，也能讓多人合作。" },
      { q: "網站首頁最常使用的檔名是？", o: ["index.html", "game.txt", "photo.jpg"], a: 0, e: "GitHub Pages 通常會優先讀取 index.html 作為首頁。" },
      { q: "HTML 主要負責網頁的哪個部分？", o: ["網頁結構", "資料庫管理", "電腦開機"], a: 0, e: "HTML 負責標題、段落、按鈕、圖片等網頁結構。" },
      { q: "CSS 主要負責什麼？", o: ["網頁外觀樣式", "遊戲存檔", "錄製聲音"], a: 0, e: "CSS 負責顏色、排版、字型、大小與動畫效果。" },
      { q: "JavaScript 可以讓網頁變得如何？", o: ["可以互動", "只能顯示黑白", "不能點擊"], a: 0, e: "按鈕、計分、切換題目等互動功能常使用 JavaScript。" },
      { q: "GitHub Pages 可以用來做什麼？", o: ["發布網站", "修理鍵盤", "刪除瀏覽器"], a: 0, e: "GitHub Pages 可以把 HTML、CSS、JS 作品發布成網站。" },
      { q: "修改程式後，要更新到 GitHub，通常要做什麼？", o: ["重新上傳或 commit 修改", "關掉螢幕", "刪除所有檔案"], a: 0, e: "修改後需要上傳檔案或 commit，讓 GitHub 記錄新版本。" },
      { q: "PWA 的特色是什麼？", o: ["讓網站更像 App", "只能在電視上用", "不能放圖片"], a: 0, e: "PWA 可以讓網站像 App 一樣被安裝到手機或電腦桌面。" },
      { q: "製作 PWA 常見的重要檔案是？", o: ["manifest.json", "homework.docx", "cat.mp3"], a: 0, e: "manifest.json 可設定 App 名稱、圖示與顯示方式。" },
      { q: "TTS 是什麼意思？", o: ["文字轉語音", "圖片變影片", "滑鼠速度設定"], a: 0, e: "TTS 是 Text To Speech，也就是把文字轉成語音。" },
      { q: "網頁遊戲中，按鈕點了會計分，通常需要哪一種技術？", o: ["JavaScript", "紙膠帶", "壓縮餅乾"], a: 0, e: "計分、判斷答案與遊戲流程通常用 JavaScript 控制。" },
      { q: "GitHub 上的一個專案資料夾通常稱為什麼？", o: ["Repository", "Sandwich", "Keyboard"], a: 0, e: "Repository 是儲存庫，可以放網站、遊戲或程式專案。" },
      { q: "如果 CSS 沒有正確連結，網頁可能會怎樣？", o: ["樣式不見，畫面變普通", "電腦爆炸", "自動變成影片"], a: 0, e: "CSS 沒有載入時，網頁結構還在，但樣式通常會消失。" },
      { q: "圖片、音效、CSS、JS 路徑錯誤，可能會發生什麼？", o: ["資源無法顯示或播放", "螢幕變大", "滑鼠變成貓"], a: 0, e: "路徑錯誤時，瀏覽器找不到檔案，功能可能失效。" },
      { q: "作品上傳到 GitHub Pages 後，可以做什麼？", o: ["分享網址給別人觀看", "只能自己看", "一定會變成手機遊戲"], a: 0, e: "發布成功後，就可以把網址分享給老師、同學或家長觀看。" }
    ];

    let current = 0;
    let points = 0;
    let answered = false;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const nextBtn = document.getElementById("next");
    const countEl = document.getElementById("count");
    const scoreEl = document.getElementById("score");
    const quizEl = document.getElementById("quiz");
    const resultEl = document.getElementById("result");

    function loadQuestion() {
      answered = false;
      nextBtn.disabled = true;
      feedbackEl.classList.remove("show");
      feedbackEl.innerHTML = "";

      const item = questions[current];
      questionEl.textContent = `${current + 1}. ${item.q}`;
      countEl.textContent = `第 ${current + 1} / ${questions.length} 題`;
      scoreEl.textContent = `分數：${points}`;
      optionsEl.innerHTML = "";

      item.o.forEach((text, index) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = `${String.fromCharCode(65 + index)}. ${text}`;
        btn.onclick = () => checkAnswer(index, btn);
        optionsEl.appendChild(btn);
      });
    }

    function checkAnswer(index, button) {
      if (answered) return;
      answered = true;

      const item = questions[current];
      const buttons = document.querySelectorAll(".option");

      buttons.forEach((btn, i) => {
        btn.disabled = true;
        if (i === item.a) btn.classList.add("correct");
      });

      if (index === item.a) {
        points += 10;
        feedbackEl.innerHTML = `<strong>答對了！太棒了 🌟</strong><br>${item.e}`;
      } else {
        button.classList.add("wrong");
        feedbackEl.innerHTML = `<strong>答錯了，沒關係 💪</strong><br>正確答案是：<strong>${String.fromCharCode(65 + item.a)}. ${item.o[item.a]}</strong><br>解答：${item.e}`;
      }

      scoreEl.textContent = `分數：${points}`;
      feedbackEl.classList.add("show");
      nextBtn.disabled = false;
    }

    nextBtn.addEventListener("click", () => {
      current++;
      if (current < questions.length) loadQuestion();
      else showResult();
    });

    function showResult() {
      quizEl.style.display = "none";
      resultEl.style.display = "block";
      document.getElementById("finalScore").textContent = `你的總分是：${points} / ${questions.length * 10}`;
      const comment = document.getElementById("comment");
      if (points >= 130) comment.textContent = "太厲害了！你已經是 GitHub 小忍者，可以帥氣發布作品了！";
      else if (points >= 90) comment.textContent = "表現很好！再複習幾個觀念，就能成為 GitHub 小達人。";
      else comment.textContent = "沒關係，程式設計就是邊做邊學。再挑戰一次，經驗值會升級！";
    }

    function restartQuiz() {
      current = 0;
      points = 0;
      quizEl.style.display = "block";
      resultEl.style.display = "none";
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
